name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-secret
      NEW_USER_PASSWORD: parola-sigura
      DATABASE_URL: sqlite:////tmp/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Backend tests
        run: python -m unittest tests.test_app

      - name: Evaluation set is valid
        run: python scripts/evaluate.py --check

      - name: Start the portal under gunicorn (fresh database, demo reports, employee account)
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi seed-reports
          flask --app wsgi create-user ana@primaria.md --name "Ana Ciobanu" --role employee
          PORT=8000 WEB_CONCURRENCY=2 gunicorn -c gunicorn.conf.py wsgi:app --daemon
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done

      - name: Browser tests
        working-directory: frontend
        env:
          PORTAL_TEST_URL: http://127.0.0.1:8000
        run: |
          npx playwright install --with-deps chromium
          node tests/smoke.cjs
          node tests/answers.cjs
          node tests/regressions.cjs
