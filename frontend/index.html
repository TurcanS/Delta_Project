<meta name="theme-color" content="#e3efff">
<script>
  // Resolve the theme before the first paint so a dark-mode visitor never sees a light flash.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').content = dark ? '#060d20' : '#e3efff';
  })();
</script>
